[package]
name = "wireflow"
version = "0.1.0"
edition = "2024"

[dependencies]
circuit_sim = {path = "../circuit_sim"}
eframe = "0.32.1"
log = "0.4.27"

# Enable a small amount of optimization in the dev profile.
[profile.dev]
opt-level = 1

# Enable a large amount of optimization in the dev profile for dependencies.
[profile.dev.package."*"]
opt-level = 3