[package]
name = "wireflow"
version = "0.1.0"
edition = "2024"

[dependencies]
wireflowapi = {path = "../wireflowapi" }
eframe = "0.32.1"

# Enable a small amount of optimization in the dev profile.
[profile.dev]
opt-level = 1

# Enable a large amount of optimization in the dev profile for dependencies.
[profile.dev.package."*"]
opt-level = 3